# Auto Shorts publishing workflow
name: Create and upload YouTube Short

on:
  schedule:
    - cron: "17 8,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/auto-shorts-trigger"

permissions:
  contents: write

concurrency:
  group: auto-shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Generate and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m autoshorts.main
      - name: Persist publishing history
        run: |
          git config user.name "auto-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json logs/
          git diff --cached --quiet || git commit -m "chore: record automated short"
          git push
