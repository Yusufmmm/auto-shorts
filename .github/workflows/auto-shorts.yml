name: Generate and schedule YouTube video
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [short, long]
        default: short
      dry_run:
        type: boolean
        default: false
  schedule:
    - cron: '17 3,9,15 * * *'
    - cron: '37 9 * * 0'
  push:
    branches: [main]
    paths: ['.github/auto-shorts-trigger']
permissions:
  contents: write
concurrency:
  group: auto-shorts-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-hosny-amiri
      - run: pip install -r requirements.txt
      - name: Test quality gates
        run: python -m pytest -q
      - name: Configure durable upload checkpoints
        run: |
          git config user.name 'auto-shorts-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: Generate and schedule
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          KIND: ${{ github.event.schedule == '37 9 * * 0' && 'long' || inputs.kind || 'short' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python -m autoshorts.publisher_v3 --kind "$KIND" --dry-run
          else
            python -m autoshorts.publisher_v3 --kind "$KIND"
          fi
      - name: Preserve video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-evidence-${{ github.run_id }}
          path: |
            build/video-v3.mp4
            build/manifest.json
            build/upload-receipt.json
            build/*v3.ass
            build/*v3.srt
          if-no-files-found: ignore
          retention-days: 14
