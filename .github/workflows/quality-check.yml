name: Quality and regression tests
on:
  push:
    paths: ['autoshorts/**', 'tests/**', 'requirements.txt', 'religious_content.json', '.github/workflows/quality-check.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q autoshorts && python -m pytest -q
