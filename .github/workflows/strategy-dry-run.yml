name: One-time Arabic strategy dry run
on:
  push:
    branches: [main]
    paths: ['.github/workflows/strategy-dry-run.yml']
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-hosny-amiri
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Generate Arabic Short without upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m autoshorts.publisher_v3 --kind short --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-strategy-dry-run-${{ github.run_id }}
          path: |
            build/video-v3.mp4
            build/manifest.json
            build/captions-v3.srt
          if-no-files-found: ignore
          retention-days: 3
